<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor absensi - {{ app_name }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/monitor.css?v=1">
</head>
<body>
    <header class="mon-head">
        <div class="mon-brand">
            <img src="/static/images/logo.svg" alt="" class="mon-logo">
            <div>
                <div class="mon-title" id="mon-title">Monitor absensi</div>
                <div class="mon-sub">{{ app_name }}</div>
            </div>
        </div>
        <div class="mon-status" id="mon-status" data-state="wait">
            <span class="dot"></span><span id="mon-status-text">Menghubungkan...</span>
        </div>
        <div class="mon-clock">
            <div id="mon-time" class="num">--.--.--</div>
            <div id="mon-date" class="mon-sub">&nbsp;</div>
        </div>
    </header>

    <main class="mon-main">
        <section class="hero" id="hero" data-state="idle" aria-live="assertive">
            <div class="hero-band" id="hero-band">Menunggu scan</div>
            <div class="hero-body">
                <div class="hero-name" id="hero-name">&nbsp;</div>
                <div class="hero-meta" id="hero-meta">&nbsp;</div>
                <div class="hero-foot">
                    <div>
                        <div class="label">Jam scan</div>
                        <div class="hero-time num" id="hero-time">--.--.--</div>
                    </div>
                    <div>
                        <div class="label">Berapa lama lalu</div>
                        <div class="hero-ago num" id="hero-ago">-</div>
                    </div>
                    <div>
                        <div class="label">Cara</div>
                        <div class="hero-verify" id="hero-verify">-</div>
                    </div>
                </div>
                <div class="hero-note" id="hero-note" hidden></div>
            </div>
        </section>

        <section class="side">
            <div class="tally">
                <div><div class="label">Scan hari ini</div><div class="tally-n num" id="t-scans">0</div></div>
                <div><div class="label">Orang</div><div class="tally-n num" id="t-people">0</div></div>
                <div><div class="label">Tidak terdaftar</div><div class="tally-n num warn" id="t-unreg">0</div></div>
            </div>
            <div class="label side-title">Scan sebelumnya</div>
            <ol class="recent" id="recent"></ol>
        </section>
    </main>

    <footer class="mon-foot">
        <label class="mon-device">Mesin
            <select id="mon-device"></select>
        </label>
        <span id="mon-user" hidden></span>
        <button type="button" id="btn-sound" class="mon-btn">Aktifkan suara</button>
        <button type="button" id="btn-full" class="mon-btn">Layar penuh</button>
        <button type="button" id="btn-logout" class="mon-btn" hidden>Keluar</button>
    </footer>

    <div class="overlay" id="overlay" hidden>
        <div class="overlay-box">
            <h1 id="overlay-title">Perlu masuk</h1>
            <p id="overlay-text"></p>
            <a class="mon-btn" href="/">Masuk</a>
        </div>
    </div>

    <script>window.APP_CONFIG = { timezone: {{ timezone|tojson }} };</script>
    <script src="/static/js/monitor.js?v=1"></script>
</body>
</html>
