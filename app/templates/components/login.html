    <!-- Login View -->
    <div id="login-container" style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: var(--background); padding: 1rem;">
        <div class="glass-panel" style="padding: 2.5rem 2.25rem; width: 400px; max-width: 100%; background: #ffffff;">
            <img src="/static/images/logo.svg" alt="" style="height: 44px; width: auto; object-fit: contain; margin-bottom: 1.25rem;">
            <h2 style="font-size: 1.35rem; font-weight: 600; color: var(--ink); margin-bottom: 0.25rem;">Masuk</h2>
            <p style="font-size: 0.9rem; color: var(--hull); margin-bottom: 1.75rem;">{{ app_name }}</p>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="login-username" class="field-label">Username</label>
                    <input type="text" id="login-username" class="form-control" autocomplete="username" required style="width: 100%;">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="login-password" class="field-label">Password</label>
                    <input type="password" id="login-password" class="form-control" autocomplete="current-password" required style="width: 100%;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.7rem; justify-content: center; font-size: 0.95rem;">
                    Masuk
                </button>
                <div id="login-error" role="alert" style="color: var(--signal); margin-top: 1rem; font-size: 0.85rem; display: none;"></div>
            </form>
        </div>
    </div>
