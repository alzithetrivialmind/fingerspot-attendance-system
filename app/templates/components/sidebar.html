            <div class="logo-text">
                <span class="logo-title">{{ app_name }}</span>
            </div>
        </div>

        <!-- Jam & tanggal (dipakai semua halaman) -->

            </li>
            <li class="nav-item" onclick="switchView('employees')" tabindex="0" role="button" onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }">

                <span>Data absensi</span>
            </li>
            <li class="nav-item" onclick="switchView('activity-log')" tabindex="0" role="button" onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }">
